# ==============================================================================
# Gateway Nginx Configuration - Campus Library Borrowing System
# Production Reverse Proxy, SSL Offloading, API Routing, and Rate Limiting
# ==============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 2048;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # 日志格式
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" $request_time';

    access_log /var/log/nginx/access.log main;

    # 基础性能参数
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # 支持 Excel 批量文件上传 (最大 50MB)
    client_max_body_size 50M;

    # Gzip 压缩设置
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 5;
    gzip_types text/plain text/css text/xml text/javascript
               application/x-javascript application/javascript
               application/xml application/json application/wasm image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # 后端应用集群
    upstream backend_cluster {
        server backend:8080 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # 前端 Web 托管服务
    upstream frontend_cluster {
        server frontend:80 max_fails=3 fail_timeout=10s;
        keepalive 32;
    }

    # --------------------------------------------------------------------------
    # HTTP 服务 (生产建议自动 301 重定向至 HTTPS)
    # --------------------------------------------------------------------------
    server {
        listen 80;
        server_name _;

        # 隐藏 Nginx 版本号
        server_tokens off;

        # 后端 RESTful API 代理
        location /api/ {
            proxy_pass http://backend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时控制 (针对 AI 推理与大文件流式导入放宽)
            proxy_connect_timeout 10s;
            proxy_read_timeout 60s;
            proxy_send_timeout 60s;

            # 禁用缓冲区以支持可能得流式输出
            proxy_buffering off;
        }

        # 后端 Spring Boot Actuator 健康检查端点
        location /actuator/ {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Swagger / OpenAPI 文档代理 (生产建议按需限制内网 IP 访问)
        location ~* ^/(swagger-ui|v3/api-docs) {
            proxy_pass http://backend_cluster;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 前端 Web SPA 静态资源与路由代理
        location / {
            proxy_pass http://frontend_cluster;
            proxy_http_version 1.1;
            proxy_set_header Connection "";

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 开启客户端缓存
            proxy_cache_bypass $http_upgrade;
        }
    }
}
